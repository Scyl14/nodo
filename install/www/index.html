<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nodo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12140f;
        --surface: #1c1f17;
        --fg: #e7e4d4;
        --muted: #9a967f;
        --primary: #d6a23a;
        --border: #34382c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif;
        padding: 24px;
      }
      main {
        width: min(100%, 28rem);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
      }
      p.mark {
        margin: 0;
        color: var(--primary);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        letter-spacing: 0.22em;
        font-size: 12px;
      }
      h1 { margin: 12px 0 0; font-size: 1.5rem; font-weight: 500; }
      p { color: var(--muted); }
      code {
        color: var(--fg);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">NODO</p>
      <h1>The Wi-Fi is up</h1>
      <p>This machine is at <code>http://10.41.0.1</code>. The network name is Nodo. Internet is not required to open this page.</p>
      <p>The console is not on this disk yet. There is no model, no radio receiver, and no neighbor list here.</p>
    </main>
  </body>
</html>
